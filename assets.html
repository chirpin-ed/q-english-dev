<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q English · 자산 구조</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#fff;--ink:#111418;--ink2:#454b53;--mute:#8a9097;--line:#e2e6e4;--deep:#173d33;--brass:#6f8078;--soft:#f3f5f4;--hl:#dbe7e1;--red:#a4473a;--bar-h:72px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16.5px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) + 24px)}
a{color:inherit;text-decoration:none}
b{font-weight:700}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
.serif{font-family:"Noto Serif KR",serif}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.top img{display:block;height:30px;width:auto}
.top .all{font-size:13.5px;font-weight:700;color:var(--deep)}

/* 훅 */
.hero{padding-top:52px;padding-bottom:34px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--mute)}
.hero h1{font-family:"Noto Serif KR",serif;font-weight:900;font-size:38px;line-height:1.25;letter-spacing:-.03em;margin:12px 0 0}

.stat{background:var(--deep);color:#fff;padding:30px 0 30px}
.stat .lb{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.6);margin:0 0 14px}
.nums{display:grid;grid-template-columns:1.1fr 1.1fr .9fr;border-top:1px solid rgba(255,255,255,.28)}
.nums div{padding:14px 0 4px}
.nums div+div{padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
.nums b{display:block;font-family:"Noto Serif KR",serif;font-weight:900;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nums small{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}
.nums small:first-child{margin:0 0 2px}
.spd2{margin:22px 0 0}
.spd2 .h{margin:0 0 4px;font-size:13px;font-weight:700;color:rgba(255,255,255,.75)}
.spd2 .h span{font-weight:500;color:rgba(255,255,255,.5)}
.spd2 .r{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 0;border-top:1px solid rgba(255,255,255,.28)}
.spd2 .n{font-size:16px;font-weight:800;line-height:1.3}
.spd2 .n small{display:block;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.6)}
.spd2 b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.spd2 b small{font-family:Pretendard,sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-left:3px}
.spd2 .me{border-top:2px solid #fff;border-bottom:2px solid #fff}
.spd2 .me .n{font-size:19px}
.spd2 .me b{font-size:42px}
.pace{margin:22px 0 0;border-top:1px solid rgba(255,255,255,.28);padding-top:16px}
.pace p{margin:0;font-size:17px;line-height:1.7}
.pace p b{font-size:20px}
.pace p.dim{color:rgba(255,255,255,.7);font-size:15.5px;margin-top:4px}
.pace p.dim b{font-size:inherit;color:#fff}
.stat .foot{margin:16px 0 0;font-size:14px;color:rgba(255,255,255,.75);line-height:1.7}
.stat .foot b{color:#fff}

.cause{padding-top:46px;padding-bottom:10px}
.cause p{margin:0;font-size:18px;color:var(--ink2)}
.cause h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:30px;line-height:1.35;letter-spacing:-.03em;margin:14px 0 0}
.cause h2 span{color:var(--deep);box-shadow:inset 0 -.32em 0 var(--hl)}

/* 맛보기 */
.show{padding-top:56px}
.kick{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--brass)}
.show h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:25px;line-height:1.4;letter-spacing:-.02em;margin:8px 0 10px}
.show .lead{margin:0 0 6px;color:var(--ink2);font-size:15.5px}
.rule{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--ink2)}
.rule svg{flex:none;width:18px;height:18px;color:var(--deep)}

.gl{margin:30px 0 0;border-top:2px solid var(--ink);padding-top:14px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.gh .t{font-size:19px;font-weight:800;letter-spacing:-.02em}
.gh .t i{font-style:normal;font-family:"Noto Serif KR",serif;font-weight:900;color:var(--brass);margin-right:8px;font-variant-numeric:tabular-nums}
.gh .why{font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.gsub{margin:4px 0 12px;font-size:14.5px;color:var(--ink2)}

/* 타이머 */
.tm{position:relative;margin:0 0 12px}
.go{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:12px;background:var(--deep);color:#fff;font:inherit;font-weight:800;font-size:16px;padding:15px 18px;cursor:pointer;box-shadow:0 2px 8px rgba(23,61,51,.25)}
.go span{font-family:"Noto Serif KR",serif;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.go small{display:block;font-weight:600;font-size:12px;opacity:.75;text-align:left}
.clock{display:none;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--soft)}
.clock .tt{font-family:"Noto Serif KR",serif;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums;min-width:66px;color:var(--deep)}
.clock .bar0{flex:1;height:6px;border-radius:3px;background:#dfe5e2;overflow:hidden}
.clock .bar0 i{display:block;height:100%;width:100%;background:var(--deep);transform-origin:left;transition:transform .25s linear}
.clock .lbl{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.gl.run .go,.gl.done .go,.gl.over .go{display:none}
.gl.run .clock,.gl.done .clock,.gl.over .clock{display:flex}
.gl.run .tm,.gl.over:not(.done) .tm{position:sticky;top:60px;z-index:5}
.gl.run .clock{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.gl.over .clock{background:#f6e9e6}
.gl.over .clock .tt{color:var(--red)}
.gl.over .clock .bar0 i{background:var(--red)}
.overmsg{display:none;margin:8px 2px 0;font-size:14px;font-weight:700;color:var(--red)}
.gl.over:not(.done) .overmsg{display:block}
.gl.done .clock .lbl{color:var(--deep)}

/* 문제 */
.body{position:relative}
.gl:not(.run):not(.done):not(.over):not(.free) .body{max-height:132px;overflow:hidden;filter:blur(3px);opacity:.55;pointer-events:none;user-select:none}
.gl:not(.run):not(.done):not(.over):not(.free) .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.psg{background:var(--soft);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.psg .src{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--mute);margin:0 0 6px}
.psg p.en{margin:0;font-family:"Noto Serif KR",serif;font-size:14.5px;line-height:1.75}
details.pv{margin:0 0 14px}
details.pv summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--deep);padding:2px 0}
details.pv summary::-webkit-details-marker{display:none}
details.pv summary::after{content:" ↓"}
details.pv[open] summary::after{content:" ↑"}
details.pv .psg{margin-top:8px}
.stem{margin:0 0 6px;font-size:15px;font-weight:700}
.opts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.opts li{padding:12px 0;border-bottom:1px solid var(--line)}
.opts .en{font-family:"Noto Serif KR",serif;font-size:15px;line-height:1.75}
.opts .no{font-weight:700;margin-right:6px;font-family:"Pretendard",sans-serif}
.more{margin:6px 0 0;font-size:20px;line-height:1;color:var(--mute)}
.ctx{margin:0 0 10px;font-family:"Noto Serif KR",serif;font-size:15px;line-height:1.75}
.ctx u{text-decoration:none;border-bottom:2px solid var(--ink)}

/* 드러나기 */
.mk{display:none;font-style:normal;font-family:"Pretendard",sans-serif;font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.mk.o{background:var(--deep);color:#fff}.mk.x{background:var(--red);color:#fff}
.ang{display:none;font-family:"Pretendard",sans-serif;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--brass);margin-top:4px}
.fix{display:none;margin-top:8px;padding:9px 12px;background:var(--soft);border-radius:8px;font-size:14.5px;line-height:1.65}
.fix .en{font-size:14.5px}
.fix b{color:var(--deep)}
.nd{transition:background .2s,color .2s}
.gl.done .mk,.gl.done .ang{display:inline-block}
.gl.done .ang{display:block}
.gl.done .fix{display:block}
.gl.done .nd.x{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#8b3a2f}
.gl.done .nd.ok{box-shadow:inset 0 -.42em 0 var(--hl)}
.gl.done .tw{box-shadow:inset 0 -.5em 0 rgba(164,71,58,.28)}
.gl.done .sl{display:inline}
.sl{display:none;color:var(--brass);font-weight:700;margin:0 3px;font-family:"Pretendard",sans-serif}
.note{display:none;margin:12px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.note b{color:var(--ink)}
.gl.done .note{display:block}
.act{display:flex;gap:8px;margin:12px 0 0}
.rv{border:1px solid var(--deep);background:#fff;color:var(--deep);font:inherit;font-weight:800;font-size:14px;padding:9px 16px;border-radius:9px;cursor:pointer}
.gl.done .rv{display:none}
.gl:not(.run):not(.over):not(.free) .act{display:none}


.cmp{display:grid;grid-template-columns:34px 1fr;gap:6px 8px;margin:10px 0 14px;font-size:14.5px;line-height:1.65}
.cmp dt{font-size:12px;font-weight:800;color:var(--mute);padding-top:2px}
.cmp dt.our{color:var(--deep)}
.cmp dd{margin:0;color:var(--ink2)}
.cmp dd b{color:var(--ink)}
.nops{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--brass)}
.src0{font-weight:500;font-size:12.5px;color:var(--mute)}
.stem u{text-decoration:underline;text-underline-offset:3px}
.psg p.en.blk{margin-top:10px}
.psg .blk b{font-family:"Pretendard",sans-serif}
.gl.done .lk{box-shadow:inset 0 -.45em 0 var(--hl);font-weight:700}
.seqopt{margin:10px 0 0;font-size:14px;line-height:1.9}
.gl.done .seqopt .ans{color:#fff;background:var(--deep);border-radius:6px;padding:1px 6px;font-weight:700}
.ctx.g u{text-decoration:underline;text-underline-offset:4px;border:0}
.gl.done .ctx.g .dm{color:var(--mute)}
.gl.done .ctx.g .tw{box-shadow:none}
.gl.done .ctx.g .tw u{text-decoration:underline line-through;text-decoration-color:var(--red);color:#8b3a2f}
.stat .big0{margin:22px 0 0;font-family:"Noto Serif KR",serif;font-weight:900;font-size:24px;line-height:1.4;letter-spacing:-.02em}
.shift{padding-top:52px}
.shift .kick{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--brass)}
.shift .lead{margin:10px 0 0;font-size:18px;line-height:1.6;color:var(--ink2)}
.three{display:flex;align-items:baseline;gap:10px;margin:18px 0 0;font-family:"Noto Serif KR",serif;font-weight:900;font-size:34px;letter-spacing:-.02em}
.three span{color:var(--deep)}
.three i{font-style:normal;color:var(--line)}
.hit{padding-top:52px}
.hit h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:27px;line-height:1.4;letter-spacing:-.03em;margin:0 0 14px}
.hit p{margin:0 0 10px;font-size:16.5px;color:var(--ink2)}
.hit p b{color:var(--ink)}
.cause p{margin:12px 0 0;font-size:17px;color:var(--ink2)}
.hit .cls{margin:22px 0 0;font-family:"Noto Serif KR",serif;font-weight:900;font-size:24px;line-height:1.45;letter-spacing:-.02em;color:var(--ink)}
.hit .cls span{color:var(--deep)}
.cause p b{color:var(--ink)}
.same{display:inline-block;margin:0 0 12px;padding:3px 10px;border-radius:999px;background:var(--hl);color:var(--deep);font-size:12.5px;font-weight:800}
.free0{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--brass)}
.fixit li{padding:14px 0}
.fixit .ctx{font-size:14px;color:var(--ink2);margin:0 0 6px}
.fixit .no{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--mute);margin:0 0 2px}
.fixit textarea{display:block;width:100%;margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14.5px;resize:vertical;background:#fff;color:var(--ink)}
.fixit textarea:focus{outline:2px solid var(--hl);border-color:var(--deep)}
.sumq{margin:6px 0 0;font-family:"Noto Serif KR",serif;font-size:15px;line-height:2.1}
.bl{width:8.5em;border:0;border-bottom:1.5px solid var(--ink);font:inherit;font-family:"Pretendard",sans-serif;font-size:14.5px;padding:0 4px;background:transparent;color:var(--deep)}
.bl:focus{outline:0;border-bottom-color:var(--deep);background:var(--soft)}
.bl.ok{border-bottom-color:var(--deep);background:var(--hl)}
.bl.ng{border-bottom-color:var(--red);background:#f6e9e6}
.gl.done .opts .fix{display:block}
.hit .pre3{margin:22px 0 0;font-size:15px;font-weight:700;color:var(--mute)}
.hit .three{margin-top:6px}
.cog{padding-top:56px}
.cog .kick{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--brass)}
.cog h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:25px;line-height:1.4;letter-spacing:-.02em;margin:8px 0 16px}
.beat{border-top:2px solid var(--ink);padding:14px 0 16px}
.beat+.beat{border-top:1px solid var(--line)}
.bh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.bh b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:24px;color:var(--deep)}
.bh span{font-size:12.5px;font-weight:700;color:var(--mute)}
.beat .why0{margin:0 0 6px;font-size:15.5px;color:var(--ink)}
.beat .how{margin:0;font-size:15px;color:var(--ink2)}
.beat b{color:var(--ink)}
.loop{margin:10px 0 0;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:15px;font-weight:700;line-height:1.8}
.loop i{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--deep);border-radius:6px;padding:1px 6px;margin:0 2px}
.show .lead b{color:var(--ink)}
.gh .t .bt{font-style:normal;font-size:11.5px;font-weight:800;color:var(--deep);background:var(--hl);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:3px;white-space:nowrap}
.cog .lead{margin:0 0 6px;font-size:16px;color:var(--ink2);line-height:1.7}
.cog .lead b{color:var(--ink)}
.nflow{list-style:none;margin:16px 0 0;padding:0;border-top:2px solid var(--ink)}
.nflow li{display:grid;grid-template-columns:52px 1fr;gap:0 10px;padding:13px 0;border-bottom:1px solid var(--line)}
.nflow b{grid-row:1/3;font-family:"Noto Serif KR",serif;font-weight:900;font-size:21px;color:var(--deep);line-height:1.3}
.nflow strong{font-size:16.5px;font-weight:800}
.nflow span{font-size:14.5px;color:var(--ink2);line-height:1.6}
.demo2{margin:22px 0 0;border:1.5px solid var(--deep);border-radius:14px;padding:14px 16px}
.dlb{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--deep)}
.dlb span{font-weight:600;color:var(--mute);font-size:12.5px}
.stmt2{margin:0;font-family:"Noto Serif KR",serif;font-size:15.5px;line-height:1.85}
.stmt2 .cut{display:none;font-style:normal;font-family:"Pretendard",sans-serif;font-weight:800;color:var(--brass);margin:0 4px}
.demo2.split .cut{display:inline}
.n2{transition:background .2s,color .2s,opacity .2s;border-radius:4px}
.n2.cur{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.n2.ok{color:var(--deep)}
.n2.ng{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#8b3a2f}
.n2.skip{opacity:.3}
.dstep{margin:12px 0 0;border-top:1px dashed #d5d8dc}
.dstep div{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #d5d8dc;font-size:14px;align-items:baseline}
.dstep .tg{font-size:12px;font-weight:800;color:var(--mute)}
.dstep .ev{font-family:"Noto Serif KR",serif;font-style:italic;color:var(--ink)}
.dstep .ev u{text-decoration:none;box-shadow:inset 0 -.45em 0 var(--hl)}
.dstep .vd b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;color:#fff;font-size:13px}
.dstep .vd b.o{background:var(--deep)} .dstep .vd b.x{background:var(--red)}
.dmsg{margin:10px 0 0;font-size:14.5px;font-weight:700;min-height:1.6em;color:var(--ink)}
.dmsg .en{font-family:"Noto Serif KR",serif;font-weight:500}
.dbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dcnt{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.dnext{border:0;background:var(--deep);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer}
.whyn{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--soft)}
.whyn .wt{margin:0 0 6px;font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--brass)}
.whyn p{margin:0 0 4px;font-size:15px}
.whyn p:last-child{margin:0}
.cb{margin:18px 0 0;padding-top:14px;border-top:2px solid var(--ink)}
.cb+.cb{border-top:1px solid var(--line)}
.cb .q{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--brass)}
.cb p{margin:0 0 10px;font-size:15.5px;line-height:1.75;color:var(--ink2)}
.cb p b{color:var(--ink)}
.eff{list-style:none;margin:4px 0 0;padding:0}
.eff li{padding:8px 0;border-top:1px dashed #d5d8dc;font-size:15px}
.eff li b{color:var(--ink)}
.eff i{font-style:normal;color:var(--deep);font-weight:800;margin:0 4px}
.habit{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.75;color:var(--ink2)}
.habit b{color:var(--ink)}
.shift2{margin:26px 0 0;font-family:"Noto Serif KR",serif;font-weight:900;font-size:23px;line-height:1.45;letter-spacing:-.02em;color:var(--deep)}
.proof .qt{margin:0 0 18px;font-family:"Noto Serif KR",serif;font-style:italic;font-size:22px;line-height:1.5;letter-spacing:-.01em;color:var(--ink)}
.proof .qt small{display:block;font-style:normal;font-size:13.5px;color:var(--mute);margin-top:4px}
.vs{padding-top:56px}
.vs .kick{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--brass)}
.vs h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:27px;line-height:1.4;letter-spacing:-.02em;margin:8px 0 10px}
.vs .lead{margin:0 0 18px;font-size:16px;color:var(--ink2)}
.vs .lead b{color:var(--ink)}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.stk i,.stkl i{display:block}
.stk .a,.stkl .a{background:var(--deep)} .stk .b,.stkl .b{background:var(--brass)} .stk .c,.stkl .c{background:var(--line)}
.stkl{list-style:none;margin:12px 0 0;padding:0}
.stkl li{display:grid;grid-template-columns:12px auto 1fr;gap:2px 8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.stkl li i{width:12px;height:12px;border-radius:3px;align-self:center}
.stkl b{font-size:15.5px}

at follows the peak.\nSo the tragedy belongs to the descent, where the resource loses its power to regenerate."}, "사례": {"1": "Although a new airport or mall opens with everyone better off for sharing it, its own success overloads the commons until it crashes and loses the ability to regenerate, which is the tragedy.", "3": "A new airport or mall opens with everyone better off for sharing it, yet its own success overloads the commons.\nJams and overcrowding shrink the benefit for all, and no single user can repair it alone.\nAny shared resource that cannot expand will peak and crash, losing its ability to regenerate.", "5": "Take a new airport or mall: it opens with everyone better off for sharing the city's budget and roads.\nWhat makes the case strange is that the very success of the place is what overloads it, as traffic grows past what the commons can support.\nJams and overcrowding then shrink the benefit for every user, and no driver or walker can repair it alone.\nThe pattern generalizes: any shared resource that cannot expand will peak and then fall.\nIts tragedy is the crash, the destruction of the resource's ability to regenerate."}, "함의": {"1": "If the tragedy lies in the crash rather than in the crowding, then what must be watched is not how many users arrive but how much of the resource's power to regenerate remains.", "3": "If the tragedy lies in the crash rather than in the crowding, then what matters is not how many users arrive but how much the resource can still renew.\nThat loss builds quietly as activity climbs toward a peak, and no single user can reverse it alone.\nSo the question to ask of any shared resource is how much of its power to regenerate remains.", "5": "If the tragedy lies in the crash rather than in the crowding, then what needs watching is not how many users arrive but how much the resource can still renew.\nCrowding only signals the problem; the loss of regenerative capacity is the problem.\nThat loss builds quietly while total and individual activity climb together toward a peak.\nAnd because no single user can reverse it alone, the descent continues once it starts.\nSo the question to ask of any shared resource is how much of its power to regenerate remains."}, "기제": {"1": "Although a shared resource initially benefits all who use it, overuse drives it past its peak into a crash that destroys its ability to regenerate, which is what makes the tragedy of the commons tragic.", "3": "A shared resource first rewards its users, but demand eventually outgrows what the commons can carry.\nOveruse then erodes everyone's benefit, and because total and individual activity keep rising together, the system peaks and falls.\nThe tragedy lies in that crash, the destruction of the resource's capacity to regenerate.", "5": "A shared resource starts out rewarding everyone who draws on it, since each user gains while the cost is spread across the whole.\nThat balance tips once traffic and demand swell past what the commons can carry.\nOvercrowding and overuse then eat into the benefit for every user alike, which is the tragedy of the commons.\nBecause total and individual activity keep climbing together, the system holds at a peak only briefly before both slide.\nWhat makes the outcome tragic is the crash itself, the loss of the resource's power to renew what it once gave."}};
